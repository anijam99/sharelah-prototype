server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location = /index.html { expires -1; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location /vendor/ { try_files $uri =404; expires 7d; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location / { try_files $uri $uri/ /index.html; }
}
